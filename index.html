<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Freund">
<meta name="theme-color" content="#fffafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2d2339" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
<title>Trainingsfreund</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Süßer Pixel-Look: Pastell, runde Karten, harte Pixelgrafik. Nachts ein gemütliches Pflaumenlila. */
:root{
  --bg:#fbeef3;
  --surface:#fffafc;
  --surface-2:#fbe6ee;
  --line:#f1cddb;
  --frame:#e9a9c0;
  --frame-d:#c97f9d;
  --fg:#5a3a4c;
  --fg-dim:#94708a;
  --accent:#7ccfae;
  --accent-d:#4ea889;
  --accent-ink:#173d30;
  --pink:#f08fb0;
  --gold:#e9b949;
  --warn:#e79a5a;
  --sad:#7aa7d8;
  --night:#3b2d4f;
  --f-disp:'Pixelify Sans',ui-rounded,system-ui,sans-serif;
  --f-body:'Nunito',ui-rounded,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#211a2b;--surface:#2d2339;--surface-2:#382b46;--line:#4d3b5e;--frame:#8d5f8a;--frame-d:#5e3d62;--fg:#f7e8f1;--fg-dim:#bfa5bd;
  --accent:#7ccfae;--accent-d:#8fe0bf;--accent-ink:#123126;--pink:#f5a3c0;--gold:#f2c14e;--warn:#f0a868;--sad:#8fb8e6;--night:#160f20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#211a2b;--surface:#2d2339;--surface-2:#382b46;--line:#4d3b5e;--frame:#8d5f8a;--frame-d:#5e3d62;--fg:#f7e8f1;--fg-dim:#bfa5bd;
  --accent:#7ccfae;--accent-d:#8fe0bf;--accent-ink:#123126;--pink:#f5a3c0;--gold:#f2c14e;--warn:#f0a868;--sad:#8fb8e6;--night:#160f20;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-disp);margin:0;font-weight:600;letter-spacing:.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
h2 img.px,.btn img.px,.muted img.px,.loot img.px,.hint img.px{display:inline-block;vertical-align:-3px}
.btn.small{display:inline-flex;align-items:center;gap:6px}

/* Kopfzeile */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--frame)}
header::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--surface)}
#hud{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;margin:0 auto;padding:7px 16px;background:none;border:0;text-align:left}
#hud .nm{flex:1;min-width:0;font-family:var(--f-disp);font-size:18px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .nm small{display:block;font-size:12px;color:var(--fg-dim);font-weight:500}
#hud .wk{display:flex;align-items:center;gap:4px;font-family:var(--f-disp);font-size:15px;color:var(--fg-dim)}
#hud .st{display:flex;align-items:center;gap:4px;font-family:var(--f-disp);font-size:18px;font-weight:600;color:var(--gold)}

main{padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.card{background:var(--surface);border:3px solid var(--frame);border-radius:14px;box-shadow:0 4px 0 var(--frame-d);padding:13px;min-width:0}
.card>h2{font-size:18px;margin-bottom:10px}
.eyebrow{font-family:var(--f-disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim)}
.muted{color:var(--fg-dim);font-size:13px}
.hint{color:var(--fg-dim);font-size:13px;margin-top:8px}
.banner{background:var(--surface);border:3px solid var(--gold);border-radius:14px;box-shadow:0 4px 0 var(--frame-d);padding:10px 12px;font-size:14px}
.banner b{display:block;font-family:var(--f-disp);font-size:16px}
.banner.sad{border-color:var(--sad)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:3px solid var(--frame);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar>div{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.tabbar button{position:relative;background:none;border:0;border-top:4px solid transparent;margin-top:-3px;padding:11px 2px 10px;font-family:var(--f-disp);font-size:15px;font-weight:500;color:var(--fg-dim)}
.tabbar button[aria-selected="true"]{color:var(--fg);border-top-color:var(--pink);background:var(--surface-2)}
.tabbar button.alert::after{content:"";position:absolute;top:7px;right:calc(50% - 30px);width:8px;height:8px;border-radius:50%;background:var(--pink)}

.btn{display:block;width:100%;border:3px solid var(--frame-d);border-radius:12px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-size:20px;font-weight:600;letter-spacing:.03em;padding:11px;margin-top:12px;text-align:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.12),0 3px 0 var(--frame-d)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 1px 0 var(--frame-d)}
.btn.ghost{background:var(--surface-2);color:var(--fg);font-size:16px;padding:9px}
.btn.pink{background:var(--pink);color:#4a1f33}
.btn.small{width:auto;padding:6px 11px;font-size:15px;margin-top:0}
.btn.danger{background:#e8768c;color:#fff}
.btn.on{background:var(--gold);color:#4a3410}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:0}
.seg.n3{grid-template-columns:repeat(3,1fr)}.seg.n4{grid-template-columns:repeat(4,1fr)}.seg.n5{grid-template-columns:repeat(5,1fr)}
.seg button{background:var(--surface);border:3px solid var(--frame);border-radius:12px;box-shadow:0 3px 0 var(--frame-d);padding:6px 2px 5px;text-align:center;min-width:0;overflow:hidden}
.seg button b{display:block;font-family:var(--f-disp);font-size:20px;line-height:1.1;font-weight:600}
.seg.n3 button b,.seg.n4 button b,.seg.n5 button b{font-size:15px;padding:4px 0}
.seg button span{display:block;font-size:11.5px;color:var(--fg-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.sug{border-style:dashed}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--frame-d);border-style:solid;color:var(--accent-ink)}
.seg button[aria-pressed="true"] span{color:var(--accent-ink)}

/* Zimmer und Tier */
.room{position:relative;border:3px solid var(--frame-d);border-radius:12px;overflow:hidden;line-height:0;background:#f3dfe8;touch-action:manipulation}
.room img.bg{width:100%;height:auto}
.petbox{position:absolute;width:32%;background:none;border:0;padding:0;line-height:0}
.petbox>img{width:100%;height:auto}
.petbox.bob>img{animation:bob 1.3s steps(1) infinite}
.petbox.hop>img{animation:hop .45s steps(3) 2}
.petbox.wobble>img{animation:wob 1.6s steps(2) infinite;transform-origin:50% 100%}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-2.8%)}}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-12%)}100%{transform:translateY(0)}}
@keyframes wob{0%,49%{transform:rotate(-5deg)}50%,100%{transform:rotate(5deg)}}
.bubble{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% - 4px);background:#fff;color:#5a3a4c;border:2px solid #4a2f45;border-radius:10px;padding:5px 8px;font-family:var(--f-disp);font-size:13px;line-height:1.2;white-space:nowrap;display:flex;align-items:center;gap:5px;z-index:3}
.bubble img.px{width:14px;height:auto}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#4a2f45}
.zz{position:absolute;right:-8%;top:-6%;font-family:var(--f-disp);font-size:18px;color:#fff;text-shadow:0 2px 0 #4a2f45;animation:zz 2.4s steps(4) infinite;line-height:1}
@keyframes zz{0%{transform:translate(0,0);opacity:0}25%{opacity:1}100%{transform:translate(10px,-24px);opacity:0}}
.fx{position:absolute;pointer-events:none;animation:rise 1.4s steps(7) forwards;line-height:0;z-index:4}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-8px) scale(1)}100%{transform:translateY(-70px);opacity:0}}
.petname{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.petname b{font-family:var(--f-disp);font-size:22px;line-height:1.1}
.petname span{color:var(--fg-dim);font-size:13px}
.needs{display:grid;gap:7px;margin-top:8px}
.need{display:grid;grid-template-columns:22px 74px 1fr;gap:8px;align-items:center;font-family:var(--f-disp);font-size:14px}
.hbar{height:12px;background:var(--surface-2);border:2px solid var(--frame-d);border-radius:8px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--pink);border-radius:6px}
.hbar.low i{background:var(--sad)}
.hbar.mid i{background:var(--gold)}
.hbar.grow i{background:var(--gold)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:96px;padding:10px 6px;background:var(--surface-2);border:3px solid var(--frame);border-radius:14px;box-shadow:0 3px 0 var(--frame-d);text-align:center}
.qt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--frame-d)}
.qt b{font-family:var(--f-disp);font-size:18px;line-height:1.1;font-weight:600}
.qt small{font-size:12.5px;color:var(--fg-dim);line-height:1.2}
.qt.done{background:var(--accent);border-color:var(--frame-d);color:var(--accent-ink)}
.qt.done small{color:var(--accent-ink)}
.banner.gift{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;border-color:var(--pink);cursor:pointer}
.petname .feed{margin-left:auto}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa .btn{margin-top:0;font-size:16px;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:6px}
.chk{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:15px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--pink);padding:0}
.wkrow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;margin-top:6px;font-size:14px}
.dots{display:flex;gap:5px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--frame-d);background:var(--surface-2)}
.dots i.on{background:var(--pink)}
.dots i.ok{background:var(--accent)}

/* Training */
ul.ex{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
ul.ex li{background:var(--surface-2);display:flex;align-items:stretch;border:2px solid var(--line);border-radius:10px;overflow:hidden}
ul.ex li.fin{opacity:.55}
.ex-main{flex:1;min-width:0;background:none;border:0;padding:8px 6px 8px 10px;display:flex;gap:9px;align-items:flex-start;text-align:left}
.ex-i{font-family:var(--f-disp);font-size:17px;color:var(--fg-dim);min-width:14px}
.ex-b{flex:1;min-width:0}
.ex-n{display:block;font-weight:700;line-height:1.3}
.ex-m{display:block;font-size:13px;color:var(--fg-dim);margin-top:1px}
.ex-h{display:block;font-size:12.5px;color:var(--fg-dim);line-height:1.35;margin-top:2px}
.chip{display:inline-block;font-family:var(--f-disp);font-size:13px;background:var(--frame);color:#fff;padding:0 8px;border-radius:8px;margin-top:5px;margin-right:4px}
.chip.note{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.ex-t{flex:none;width:66px;background:var(--accent);color:var(--accent-ink);border:0;border-left:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px}
.ex-t b{font-family:var(--f-disp);font-size:22px;line-height:1;font-weight:600}
.ex-t span{font-family:var(--f-disp);font-size:12px}
details.warm{margin-top:12px;background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
details.warm summary{font-family:var(--f-disp);font-size:15px;cursor:pointer}
details.warm li{font-size:13.5px;margin:3px 0}
details.warm li span{color:var(--fg-dim)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:31;max-width:536px;margin:0 auto;background:var(--night);color:#fbe9f2;border:3px solid var(--frame);border-radius:14px;box-shadow:0 4px 0 var(--frame-d);padding:8px 12px;display:flex;align-items:center;gap:10px}
#timer.done{background:var(--accent);color:var(--accent-ink)}
#timer .tl{flex:1;min-width:0;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timer .tl small{display:block;font-family:var(--f-disp);font-size:12px;opacity:.75}
#timer .tt{font-family:var(--f-disp);font-size:32px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
#timer button{background:none;border:2px solid currentColor;border-radius:8px;padding:4px 8px;font-family:var(--f-disp);font-size:15px}

/* Kalender */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.week .dn{text-align:center;font-family:var(--f-disp);font-size:13px;color:var(--fg-dim)}
.week .cell{height:50px;width:100%;padding:3px 0 0;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;color:var(--fg);border:2px solid var(--line);border-radius:8px;min-width:0}
.week .cell i{font-style:normal;font-size:10.5px;line-height:1;opacity:.75}
.week .cell b{font-family:var(--f-disp);font-size:15px;line-height:1.1;font-weight:600}
.week .cell .ic{display:flex;gap:1px}
.week .cell.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-d)}
.week .cell.today{border-color:var(--fg);border-width:3px}
.week .cell:disabled{opacity:.45;cursor:default}
.week .cell.out{visibility:hidden}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead h2{flex:1;text-align:center;font-size:19px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:2px solid var(--line)}

/* Sachen */
.tile{position:relative;flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:3px solid var(--line);border-radius:10px}
.tile.r1{border-color:#8fa8f0}.tile.r2{border-color:var(--gold)}.tile.r3{border-color:var(--pink);border-style:double;border-width:4px}
.tile .on{position:absolute;left:-3px;top:-3px;font-family:var(--f-disp);font-size:10px;line-height:1;background:var(--accent);color:var(--accent-ink);padding:2px 3px;border-radius:6px}
.tile .cnt{position:absolute;right:-3px;bottom:-3px;font-family:var(--f-disp);font-size:12px;line-height:1;background:var(--frame-d);color:#fff;padding:2px 4px;border-radius:6px}
.tile.lock{border-style:dashed;opacity:.55;font-family:var(--f-disp);font-size:18px;color:var(--fg-dim)}
.spk{position:absolute;width:4px;height:4px;background:#fff;box-shadow:0 0 0 1px rgba(233,185,73,.9);animation:spk 1.4s steps(2) infinite}
.spk.a{left:6px;top:7px}.spk.b{right:7px;bottom:10px;animation-delay:.7s}
@keyframes spk{0%,49%{opacity:1}50%,100%{opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;justify-items:center}
.grid button{background:none;border:0;padding:0}
.slotrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px solid var(--line)}
.slotrow:first-of-type{border-top:0}
.slotrow .sl{flex:1;min-width:0}
.slotrow .sl b{display:block;font-weight:700}
.slotrow .sl small{color:var(--fg-dim);font-size:12.5px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px}
.opt.sel{border-color:var(--accent-d);border-width:3px}
.opt small{display:block;color:var(--fg-dim);font-size:12.5px}
.opt>span{flex:1;min-width:0}
.opt>.tile{flex:none}
.r1t{color:#5f7fd6}.r2t{color:#c58d14}.r3t{color:#d9578a}
:root[data-theme="dark"] .r1t{color:#9db4f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .r1t{color:#9db4f5}}

/* Geschenk und Überraschungen */
#pop{position:fixed;inset:0;z-index:65;background:var(--night);color:#fbe9f2;overflow-y:auto;padding:calc(64px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#pop .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
#pop h3{font-size:26px}
#pop .muted{color:#d6bfd2}
#pop .pp{animation:pop .5s steps(5) both}
#pop input{background:#fff;color:#5a3a4c;text-align:center;font-family:var(--f-disp);font-size:20px;max-width:300px}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;font-family:var(--f-disp);font-size:18px}
.loot span{display:flex;align-items:center;gap:5px}
.pickc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.18);border-radius:14px;padding:10px}
.pickc.r1{border-color:#8fa8f0}.pickc.r2{border-color:#f2c14e}.pickc.r3{border-color:#f5a3c0}
.pickc .pt{flex:1;min-width:0}
.pickc .pn{font-family:var(--f-disp);font-size:17px;line-height:1.2;font-weight:600}
.pickc .tile{background:rgba(255,255,255,.9)}
.pickc .btn{margin-top:0}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}

.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(40,20,40,.5)}
.sheet .inner{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border:3px solid var(--frame);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:21px;margin-bottom:2px}
#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:80;max-width:528px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:12px;padding:9px 14px;font-family:var(--f-disp);font-size:17px;text-align:center;white-space:pre-line}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:2px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.field{flex:1;min-width:84px}
label{display:block;font-family:var(--f-disp);font-size:13px;color:var(--fg-dim);margin-bottom:3px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:7px 9px}
textarea{min-height:70px;resize:vertical;font-size:13px}

const X=(id,sets,pause,p,opts)=>({id,sets,pause,p,opts});

const WARM=[['Hüftkreisen und Beinpendel','10 je Richtung und Seite'],['Monster Walks mit Band','2 × 10 Schritte je Richtung'],['Copenhagen Plank, Knie abgelegt','2 × 15–20 s je Seite'],
 ['Wadenheben einbeinig auf einer Stufe','2 × 15 je Seite'],['Einbeinstand, Augen zu','2 × 30 s je Seite'],['Band Pull-Aparts','2 × 15'],['Landungstechnik','5 × weich von der Stufe landen, Knie über den Füßen']];
/* Sterne: die einzige Währung. Was man sammelt, lässt das Tier wachsen, ausgeben im Laden macht es nicht kleiner. */
const STAR={sess:20,bball:20,stretch:5,steps:5,week:30,stage:10,warm:5};
/* ================= Hilfen ================= */
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function today(){return iso(new Date());}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const[a,b,cc]=s.split('-').map(Number);return new Date(a,b-1,cc);}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function addDays(ds,n){const d=parse(ds);d.setDate(d.getDate()+n);return iso(d);}
function fmtDate(s){const d=parse(s);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';}
function dayName(s){return DAYS[(parse(s).getDay()+6)%7];}
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x;}
function weekKey(ds){return iso(mondayOf(parse(ds)));}
function ago(n){return n===null?'noch nie':n===0?'heute':n===1?'gestern':'vor '+n+' T';}
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x;};
function fmtTime(min){let m=Math.floor(min),s=Math.round((min-m)*60);if(s===60){m++;s=0;}return m+':'+String(s).padStart(2,'0');}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nf=n=>Math.round(n).toLocaleString('de-DE');
const $=s=>document.querySelector(s);
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return ()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
const pickR=(arr,r)=>arr[Math.floor((r||Math.random)()*arr.length)];

/* ================= Speicher =================
   Trainingsprotokoll (KEY) und Spielstand (GKEY) liegen getrennt. Vor dem ersten Start einer neuen Fassung
   wandert der unveränderte alte Stand in eine eigene Ablage (BKEY). */
const KEY='freund-log',GKEY='freund-spiel',BKEY='freund-kopie',VKEY='freund-version',APP_V=3;
(function(){try{
  const old=localStorage.getItem(VKEY),raw=localStorage.getItem(KEY);
  if(old!==String(APP_V)){
    if(raw)localStorage.setItem(BKEY,JSON.stringify({von:old||'0',am:iso(new Date()),s:raw,g:localStorage.getItem(GKEY)}));
    localStorage.setItem(VKEY,String(APP_V));}
}catch(e){}})();
function readCopy(){try{const r=localStorage.getItem(BKEY);if(!r)return null;const o=JSON.parse(r);if(!o||!o.s)return null;
  return {tag:fmtDate(o.am)+parse(o.am).getFullYear(),raw:o};}catch(e){return null;}}
const DEF=()=>({log:[],bball:[],stretch:[],steps:[],ex:{},ev:[],live:null,goal:{s:2,b:2},pause:null,pauses:[],start:null,lastBackup:null,v:1});
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return {};}
function migrate(p){
  const d=DEF(),s=Object.assign({},d,p||{});
  s.goal=Object.assign({},d.goal,s.goal||{});
  ['log','bball','stretch','steps','ev','pauses'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(!s.ex||typeof s.ex!=='object')s.ex={};
  return s;
}
let S=migrate(load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ================= Protokoll ================= */
function exState(id){if(!S.ex[id])S.ex[id]={opt:0,lvl:0,since:today(),note:''};return S.ex[id];}
function curOpt(e){return e.opts[Math.min(exState(e.id).opt,e.opts.length-1)];}
function curLvl(e){const o=curOpt(e);return o.l[Math.min(exState(e.id).lvl,o.l.length-1)];}
function lastOf(id){let b=null;for(const l of S.log)if(l.s===id&&(!b||l.date>b))b=l.date;return b;}
function suggest(){return [...PLAN].sort((a,b)=>(lastOf(a.id)||'')<(lastOf(b.id)||'')?-1:(lastOf(a.id)||'')>(lastOf(b.id)||'')?1:0)[0];}
function liveSets(id){return S.live&&S.live.date===today()&&S.live.sets[id]||0;}
function addLog(ds,id,note,warm){S.log.push({date:ds,s:id,note:note||'',warm:!!warm});if(!S.start||ds<S.start)S.start=ds;}
function setLevel(e,lvl){const st=exState(e.id);let n=0;
  for(let l=1;l<=lvl;l++)if(!S.ev.some(x=>x.t==='stage'&&x.ex===e.id&&x.opt===st.opt&&x.lvl===l)){S.ev.push({date:today(),t:'stage',ex:e.id,opt:st.opt,lvl:l});n++;}
  st.lvl=lvl;st.since=today();return n;}
function stepsOn(ds){const x=S.steps.find(q=>q.date===ds);return x?x.n:0;}
function paused(){return !!S.pause;}
function pausedOn(ds){return S.pauses.some(p=>ds>=p.from&&ds<=p.to)||(S.pause&&ds>=S.pause.since);}
function setPause(on){
  if(on&&!S.pause)S.pause={since:today()};
  else if(!on&&S.pause){S.pauses.push({from:S.pause.since,to:today()});S.pause=null;}
}
function weekMap(log,bball){const w={};const g=k=>w[k]||(w[k]={s:0,b:0});
  (log||S.log).forEach(l=>g(weekKey(l.date)).s++);(bball||S.bball).forEach(d=>g(weekKey(d)).b++);return w;}
function weekPaused(k){const end=addDays(k,6);return S.pauses.some(p=>p.from<=end&&p.to>=k)||(S.pause&&S.pause.since<=end);}
/* Gesammelte Sterne und woher sie kommen: Kraft (Training), Spiel (Basketball), Pflege (Dehnen und Schritte) */
function wCalc(since){
  const s0=since||'0000',log=S.log.filter(l=>l.date>=s0),bball=S.bball.filter(d=>d>=s0);
  const w=weekMap(log,bball);let sess=0,bb=0,bonus=0,streak=0;
  for(const k in w){sess+=Math.min(w[k].s,3)*STAR.sess;bb+=Math.min(w[k].b,3)*STAR.bball;}
  const stretch=new Set(S.stretch.filter(d=>d>=s0)).size*STAR.stretch,steps=S.steps.filter(x=>x.n>=10000&&x.date>=s0).length*STAR.steps;
  const stage=S.ev.filter(e=>e.t==='stage'&&e.date>=s0).length*STAR.stage,warm=log.filter(l=>l.warm).length*STAR.warm;
  const st0=S.start?(S.start>s0?S.start:s0):null;
  if(st0&&(log.length||bball.length)){const cur=mondayOf(parse(st0)),end=weekKey(today());
    for(let g=0;g<600;g++){const k=iso(cur),x=w[k]||{s:0,b:0};
      if(x.s>=S.goal.s&&x.b>=S.goal.b){streak++;bonus+=STAR.week;}else if(k!==end&&!weekPaused(k))streak=0;
      if(k>=end)break;cur.setDate(cur.getDate()+7);}}
  const kraft=sess+stage+warm,spiel=bb,pflege=stretch+steps;
  return {total:kraft+spiel+pflege+bonus,kraft,spiel,pflege,bonus,sess,bb,stretch,steps,stage,warm,streak};
}

let TOASTT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(TOASTT);TOASTT=setTimeout(()=>{t.hidden=true;},3000);}

/* ================= Pausen-Timer ================= */
let T=null,AC=null,WL=null;
function ensureAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{if(AC)[0,.22,.44].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=[784,988,1175][i];o.connect(g);g.connect(AC.destination);
  const t=AC.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2);});}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}}
async function wake(on){try{if(on&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');}else if(!on&&WL){await WL.release();WL=null;}}catch(e){}}
function startTimer(sec,label){stopTimer();T={end:Date.now()+sec*1000,label,done:false};ensureAudio();wake(true);
  const bar=$('#timer');bar.hidden=false;bar.classList.remove('done');T.int=setInterval(drawTimer,250);drawTimer();}
function drawTimer(){if(!T)return;const left=Math.ceil((T.end-Date.now())/1000),bar=$('#timer');
  $('#tmL').textContent=T.label;
  if(left<=0){if(!T.done){T.done=true;beep();bar.classList.add('done');T.hide=setTimeout(stopTimer,30000);}$('#tmT').textContent='Weiter';}
  else $('#tmT').textContent=fmtTime(left/60);}
function stopTimer(){if(!T)return;clearInterval(T.int);clearTimeout(T.hide);T=null;$('#timer').hidden=true;wake(false);}
$('#tmX').onclick=stopTimer;
$('#tmP').onclick=()=>{if(!T)return;T.end=Math.max(T.end,Date.now())+30000;T.done=false;clearTimeout(T.hide);$('#timer').classList.remove('done');drawTimer();};

/* ----- Wachstum: gezählt ab dem Tag, an dem das Tier geschlüpft ist ----- */
function growth(){return wCalc(G.pet.hatched||today());}

function nextStageW(){const s=stageNow();return s>=1&&s<4?STAGEW[s+1]:null;}
function friendNow(){if(!G.pet.hatched)return 0;const w=growth().total;return w>=STAGEW[4]?1+Math.floor((w-STAGEW[4])/FRIENDW):0;}
function formFor(){
  const x=growth(),r={kraeftig:x.kraft/45,flink:x.spiel/40,sanft:x.pflege/35};
  const o=Object.entries(r).sort((a,b)=>b[1]-a[1]);
  return o[0][1]>=o[1][1]*1.3&&o[0][1]>0?o[0][0]:'stern';
}
function petKey(st){
  st=st===undefined?stageNow():st;const sp=G.pet.sp;
  if(st<=2)return sp+Math.max(1,st);
  const f=st===3?G.pet.f3:G.pet.f4;return sp+st+((FORMN[f]||FORMN.stern).l);
}
function hatch(ds){
  if(G.pet.hatched)return;
  G.pet.sp=pickR(SPECIES);G.pet.col=Math.floor(Math.random()*PETPAL.length);G.pet.hatched=ds&&ds<today()?ds:today();G.seenStage=1;
  G.album.push(G.pet.sp+'1');

/* ----- Bedürfnisse: Tag für Tag aus dem Protokoll ----- */
function needs(){
  const start=G.pet.hatched;if(!start)return null;
  const t=today(),tc={},bc={},sc=new Set(S.stretch),stp={},fed={};
  S.log.forEach(l=>{tc[l.date]=(tc[l.date]||0)+1;});S.bball.forEach(d=>{bc[d]=(bc[d]||0)+1;});
  S.steps.forEach(q=>{stp[q.date]=q.n;});G.fed.forEach(f=>{(fed[f.date]=fed[f.date]||[]).push(f.t);});
  let s=80,f=80,p=80,last=null;const cl=v=>Math.max(0,Math.min(100,v));
  for(let d=start,g=0;d<=t&&g<5000;d=addDays(d,1),g++){
    if(d!==start&&!pausedOn(d)){s-=9;f-=8;p-=6;}
    const st=stp[d]||0;
    s+=50*(tc[d]||0);f+=50*(bc[d]||0);if(sc.has(d))p+=30;p+=st>=10000?20:st>=5000?10:0;
    (fed[d]||[]).forEach(k=>{const T_=TREATS[k];if(T_){s+=T_.s;f+=T_.f;}});f+=3*Math.min(3,G.pets[d]||0);
    if(tc[d]||bc[d]||sc.has(d)||st>=5000)last=d;
    s=cl(s);f=cl(f);p=cl(p);
  }
  return {s,f,p,idle:last?daysBetween(last,t):daysBetween(start,t)};
}
let AWAKE=0,REACT=null,REACTT=null;
function isNight(){const h=new Date().getHours();return h>=22||h<7;}
function mood(){
  if(!G.pet.hatched)return {k:'ei'};
  if(paused())return {k:'winter'};
  const n=needs();
  if(isNight()&&Date.now()>AWAKE)return {k:'schlaf',n};
  const lo=Math.min(n.s,n.f,n.p),avg=(n.s+n.f+n.p)/3,low=[['s',n.s],['f',n.f],['p',n.p]].sort((a,b)=>a[1]-b[1])[0][0];
  if(n.idle>=10)return {k:'vermisst',n,low};
  if(lo<25)return {k:'traurig',n,low};
  if(lo<45)return {k:'mies',n,low};
  if(avg>=80&&lo>=60)return {k:'super',n};
  return {k:'gut',n};
}
function faceFor(m){

}

/* ----- Beute ----- */
function rollRar(min){const x=Math.random()*100;let r=x<4?2:x<26?1:0;if(G.pity>=11)r=Math.max(r,1);r=Math.max(r,min||0);if(r>=1)G.pity=0;else G.pity++;return r;}
function lowerRar(r){return Math.max(0,r-(Math.random()<.25?0:1));}
function owns(art,rar,col){return G.inv.some(i=>i.art===art&&i.rar===rar&&i.col===col);}
/* Drei verschiedene Stücke, eins in der gewürfelten Seltenheit, die anderen meist darunter; manchmal Leckerli statt eines Stücks */
function giftOptions(min){
  const r=rollRar(min),rs=[r,lowerRar(r),lowerRar(r)];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rs[i],rs[j]]=[rs[j],rs[i]];}
  const used=new Set(),arts=Object.keys(CAT).filter(a=>!CAT[a].sp),outA=arts.filter(a=>OUTFIT.includes(CAT[a].k)),roomA=arts.filter(a=>ROOM.includes(CAT[a].k));
  const opts=rs.map((rr,i)=>{let it=null;const pool=i%2?roomA:outA;
    for(let g=0;g<40;g++){const a=pickR(g<20?pool:arts);if(used.has(a))continue;const cand=rollItem(a,rr);if(owns(a,rr,cand.col)&&g<30)continue;it=cand;break;}
    if(!it)it=rollItem(pickR(arts.filter(a=>!used.has(a))),rr);it.id=G.nextId++;
    used.add(it.art);return {t:'item',it};});
  const lowest=()=>opts.findIndex(o=>o.t==='item'&&o.it.rar===Math.min(...opts.filter(q=>q.t==='item').map(q=>q.it.rar)));
  if(Math.random()<.25){const spT=Object.keys(TREATS).filter(k=>TREATS[k].sp&&!G.found.includes(k)),k=spT.length&&Math.random()<.4?pickR(spT):pickR(Object.keys(TREATS).filter(k=>!TREATS[k].sp||G.found.includes(k)));opts[lowest()]={t:'treat',k,n:2};}
  const spA=Object.keys(CAT).filter(a=>CAT[a].sp&&!MSART.has(a)&&!ownsArt(a));
  if(spA.length&&Math.random()<.15)opts[lowest()]={t:'item',it:mkSpecial(pickR(spA))};
  return opts;
}
function queueGift(c){c.id=G.nextId++;G.gifts.push(c);G.stats.gifts++;}
function lootCount(k,ds){const wk=weekKey(ds);return G.loot.filter(l=>l.k===k&&weekKey(l.date)===wk).length;}
function claimGift(c,i){
  G.bonus=(G.bonus||0)+(c.stars||0);for(const k in (c.treats||{}))G.treats[k]=(G.treats[k]||0)+c.treats[k];
  let msg='';
  if(c.opts&&i!=null){const o=c.opts[i];
    if(o.t==='treat'){G.treats[o.k]=(G.treats[o.k]||0)+o.n;if(TREATS[o.k].sp&&!G.found.includes(o.k))G.found.push(o.k);msg=o.n+' × '+TREATS[o.k].n;}
    else{G.inv.push(o.it);msg=itemName(o.it);const k=slotOf(o.it);
      if(!(OUTFIT.includes(k)?G.wear[k]:G.room[k])){useItem(o.it);msg+=OUTFIT.includes(k)?' · gleich angezogen':' · gleich aufgestellt';}}}
  if(c.single){const it=c.single;G.inv.push(it);msg=itemName(it);const k=slotOf(it);
    if(!(OUTFIT.includes(k)?G.wear[k]:G.room[k])){useItem(it);msg+=OUTFIT.includes(k)?' · gleich angezogen':' · gleich aufgestellt';}}

}

function finishTraining(sid,ds,warm,note){
  addLog(ds,sid,note,warm);
  const recent=daysBetween(ds,today())<=6;
  if(!G.pet.hatched)hatch(ds);
  if(recent&&lootCount('t',ds)<3){G.loot.push({k:'t',date:ds});
    const sure=G.sure>0;if(sure)G.sure--;
    queueGift({kind:'t',title:'Ein Geschenk!',sub:'Fürs Training',opts:giftOptions(sure?1:0)});}
}
function toggleBall(ds){
  const on=S.bball.includes(ds);
  if(on){S.bball=S.bball.filter(d=>d!==ds);return null;}
  S.bball.push(ds);S.bball.sort();if(!S.start||ds<S.start)S.start=ds;
  if(daysBetween(ds,today())<=6&&lootCount('b',ds)<3&&!G.loot.some(l=>l.k==='b'&&l.date===ds)){G.loot.push({k:'b',date:ds});
    const opts=giftOptions(0);if(!ownsArt('basketball')&&!G.gifts.some(g=>g.opts&&g.opts.some(o=>o.it&&o.it.art==='basketball')))opts[0]={t:'item',it:mkSpecial('basketball')};
    queueGift({kind:'b',title:'Ein Geschenk!',sub:'Fürs Basketball',opts});}
  return '';
}

function gameTick(){
  if(!G.since)return;
  const k=weekKey(today()),w=weekMap()[k]||{s:0,b:0};
  if(w.s>=S.goal.s&&w.b>=S.goal.b&&!G.week[k]){G.week[k]=1;
    queueGift({kind:'w',title:'Wochengeschenk',sub:'Wochenziel geschafft',opts:giftOptions(1)});}
  if(!G.pet.hatched)return;
  const st=stageNow();
  while(G.seenStage<st){G.seenStage++;
    if(G.seenStage===3)G.pet.f3=formFor();
    if(G.seenStage===4)G.pet.f4=formFor();
    const key=petKey(G.seenStage);if(!G.album.includes(key))G.album.push(key);
    POPS.push({t:'grow',stage:G.seenStage});}
  const fr=friendNow();
  while(G.friend<fr){G.friend++;queueGift({kind:'f',title:'Herzgeschenk',sub:'Freundschaft Stufe '+G.friend,opts:giftOptions(1)});}

  /* alte Fütter- und Streichel-Einträge aufräumen */
  const cut=addDays(today(),-40);G.fed=G.fed.filter(f=>f.date>=cut);for(const d in G.pets)if(d<cut)delete G.pets[d];
}

function shopOffers(){

  if(G.shop.wk!==wk){G.shop.wk=wk;G.shop.bought=[];}

const DARK='#3a2436';
function shade(h,f){const c=hexRGB(h);return '#'+c.map(v=>Math.round(v*f).toString(16).padStart(2,'0')).join('');}
function drawProc(ctx,ox,oy,proc,pal,a,rows){
  const px=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(ox+x,oy+y,1,1);};
  if(!a){/* Vorschau für das Symbol */
    a={el:[3,4],er:[10,4],top:[8,1],w:[1,15]};rows=null;
    if(proc==='schal'||proc==='tuch'||proc==='glocke'){for(let x=2;x<14;x++){px(x,3,pal.a);px(x,4,x%2?pal.c:pal.A);}
      if(proc==='schal'){for(let y=5;y<10;y++){px(10,y,pal.a);px(11,y,pal.A);}px(10,10,pal.c);px(11,10,pal.c);}
      if(proc==='tuch'){[[5,10,5],[6,9,6],[7,8,7]].forEach(([x0,x1,y])=>{for(let x=x0;x<=x1;x++)px(x,y,pal.a);});}
      if(proc==='glocke'){[[7,5],[8,5],[6,6],[7,6],[8,6],[9,6],[6,7],[7,7],[8,7],[9,7]].forEach(([x,y])=>px(x,y,'#f2c14e'));px(7,8,DARK);px(8,8,DARK);}
      return;}
    if(proc==='band'){for(let x=1;x<15;x++){px(x,4,pal.a);px(x,5,pal.c);px(x,6,pal.A);}return;}
    if(proc==='phones'){for(let x=4;x<12;x++)px(x,1,pal.A);px(3,2,pal.A);px(12,2,pal.A);[[1,3],[12,3]].forEach(([x0,y0])=>{for(let y=y0;y<y0+5;y++){px(x0,y,pal.a);px(x0+1,y,pal.a);px(x0+2,y,pal.A);}});return;}
    if(proc==='stetho'){for(let x=3;x<13;x++)px(x,2,pal.a);for(let y=3;y<7;y++){px(3,y,pal.a);px(12,y,pal.a);}for(let y=7;y<9;y++)px(4,y,pal.a);[[4,9],[5,9],[4,10],[5,10]].forEach(([x,y])=>px(x,y,pal.c));px(12,7,DARK);return;}
    if(proc==='pflaster'){[[4,4],[5,4],[6,5],[7,5],[8,6],[9,6],[10,7],[11,7],[5,5],[6,6],[7,6],[8,7],[9,7],[10,8]].forEach(([x,y])=>px(x,y,pal.a));px(7,5,pal.c);px(8,6,pal.c);return;}
  }
  const [lx,ly]=a.el,[rx,ry]=a.er,fr=shade(pal.A,.62);
  if(proc==='brille'){[[lx,ly],[rx,ry]].forEach(([x,y])=>{for(let i=-1;i<=2;i++){px(x+i,y-1,fr);px(x+i,y+2,fr);}px(x-1,y,fr);px(x-1,y+1,fr);px(x+2,y,fr);px(x+2,y+1,fr);});
    for(let x=lx+3;x<rx-1;x++)px(x,ly,fr);}
  else if(proc==='sonne'){[[lx,ly],[rx,ry]].forEach(([x,y])=>{for(let i=-1;i<=2;i++){px(x+i,y-1,pal.A);px(x+i,y,DARK);px(x+i,y+1,DARK);}px(x,y,'#8a7a96');});
    for(let x=lx+3;x<rx-1;x++)px(x,ly-1,pal.A);}
  else if(proc==='herz'){const H_=['##.##','#####','.###.','..#..'];[[lx-2,ly-1],[rx-1,ry-1]].forEach(([x,y])=>{H_.forEach((r,dy)=>{for(let dx=0;dx<5;dx++)if(r[dx]==='#')px(x+dx,y+dy,dy===0&&dx===1?pal.c:shade(pal.A,.85));});});
    for(let x=lx+3;x<rx-1;x++)px(x,ly,fr);}
  else if(proc==='pflaster'){const x=rx+2,y=ry+2;[[0,0],[1,0],[1,1],[2,1],[3,1],[2,2],[3,2],[4,2]].forEach(([dx,dy])=>px(x+dx-1,y+dy,pal.a));px(x+1,y+1,pal.c);}
  else if(proc==='phones'&&rows){const [hx,hy,hrx,hry]=a.hb;
    for(let x=Math.ceil(hx-hrx+2);x<=Math.floor(hx+hrx-2);x++){const dx=(x+.5-hx)/hrx;const y=Math.round(hy-hry*Math.sqrt(Math.max(0,1-dx*dx)))-1;px(x,y,pal.A);}
    [Math.round(hx-hrx)-1,Math.round(hx+hrx)-2].forEach(x0=>{for(let y=a.el[1]-2;y<=a.el[1]+2;y++){px(x0,y,pal.a);px(x0+1,y,pal.a);}px(x0,a.el[1]-2,pal.c);});}
  else if(proc==='band'&&rows){const y0=a.top[1]+2;for(const y of [y0,y0+1])for(let x=0;x<32;x++){const ch=rows[y]&&rows[y][x];if(ch&&ch!=='.'&&ch!=='o')px(x,y,y===y0?pal.a:pal.c);}}
  else if(rows&&(proc==='schal'||proc==='tuch'||proc==='glocke')){
    const nk=a.neck?a.neck[1]:(a.m?a.m[1]+3:a.el[1]+5),cx=a.top[0];
    const inb=(x,y)=>{const ch=rows[y]&&rows[y][x];return ch&&ch!=='.'&&ch!=='o';};
    for(let x=0;x<32;x++){if(inb(x,nk))px(x,nk,pal.a);if(proc==='schal'&&inb(x,nk+1))px(x,nk+1,x%2?pal.c:shade(pal.A,.8));else if(inb(x,nk+1))px(x,nk+1,shade(pal.A,.8));}
    if(proc==='schal'){for(let y=nk+2;y<nk+6;y++){px(cx+3,y,pal.a);px(cx+4,y,pal.A);}px(cx+3,nk+6,pal.c);px(cx+4,nk+6,pal.c);}
    if(proc==='tuch'){[[-2,2,1],[-1,1,2],[0,0,3]].forEach(([x0,x1,dy])=>{for(let x=x0;x<=x1;x++)px(cx+x,nk+dy,dy===3?pal.A:pal.a);});}
    if(proc==='glocke'){[[0,1],[1,1],[-1,2],[0,2],[1,2],[2,2]].forEach(([dx,dy])=>px(cx-1+dx,nk+dy,'#f2c14e'));px(cx-1,nk+1,'#fff1b3');px(cx,nk+3,DARK);}
  }
  else if(rows&&proc==='stetho'){const nk=a.neck?a.neck[1]:(a.m?a.m[1]+3:a.el[1]+5),cx=a.top[0];
    const inb=(x,y)=>{const ch=rows[y]&&rows[y][x];return ch&&ch!=='.'&&ch!=='o';};
    for(let x=0;x<32;x++)if(inb(x,nk))px(x,nk,pal.a);
    for(let y=nk+1;y<nk+4;y++){px(cx-3,y,pal.a);px(cx+2,y,pal.a);}
    [[-4,4],[-3,4],[-4,5],[-3,5]].forEach(([dx,dy])=>px(cx+dx,nk+dy,pal.c));px(cx-3,nk+4,pal.A);px(cx+2,nk+4,DARK);}
}
const DIG={'1':['.#.','##.','.#.','.#.','###'],'2':['##.','..#','.#.','#..','###'],'3':['##.','..#','.#.','..#','##.'],'7':['###','..#','.#.','.#.','.#.']};
const TOPMASK=['...##....##...','..##########..','.############.','##############','###.######.###','...########...','...########...','...########...','...########...','...########...','...########...','...########...'];
function drawTop(ctx,ox,oy,it,a,rows,st){
  const A=CAT[it.art],T=A.top,pal=itemPal(it),px=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(ox+x,oy+y,1,1);};
  let y0,y1,cx,bw,inside,sleeveOf;
  if(!a){/* Vorschau: ein Shirt */
    cx=7;y0=1;y1=11;bw=4;
    TOPMASK.forEach((r,y)=>{for(let x=0;x<14;x++)if(r[x]==='#'){const sl=x<3||x>10;if(T==='trikot'&&sl)continue;
      let col=sl?pal.A:pal.a;if(T==='ringel'&&y%2)col=sl?pal.A:pal.c;if(T==='trikot'&&A.pin&&x%3===0)col=pal.A;if(T==='schuerze'&&!sl)col=(x+y)%2?pal.a:pal.c;if(T==='schuerze'&&sl)continue;if(T==='kittel'&&x===7)col=pal.A;
      if(A.band&&y>=9)col=A.band[y-9];px(x+1,y,col);}});
    px(7,0,pal.c);px(8,0,pal.c);
    if(T==='herz'){[[6,4],[8,4],[5,5],[6,5],[7,5],[8,5],[9,5],[6,6],[7,6],[8,6],[7,7]].forEach(([x,y])=>px(x,y,pal.c));}
    if(T==='hoodie'){for(let x=5;x<11;x++)px(x,8,pal.A);px(7,2,pal.c);px(9,2,pal.c);}
    if(T==='trikot'){[...A.num].forEach((d,i)=>DIG[d].forEach((r,dy)=>{for(let dx=0;dx<3;dx++)if(r[dx]==='#')px(4+i*4+dx,4+dy,pal.c);}));}
    if(T==='kittel'){px(4,5,pal.c);px(4,6,pal.c);}
    return;}
  const ok=c=>c&&'bBwhpmi'.includes(c);
  if(a.body){const [bx,by,brx,bry]=a.body;cx=bx;bw=brx;y0=Math.ceil(by-bry)+1;y1=Math.floor(by+bry*.6);inside=x=>Math.abs(x+.5-bx)<=brx+2.8;sleeveOf=x=>Math.abs(x+.5-bx)>brx-.4;}
  else{const [hx,hy,hrx,hry]=a.hb;cx=hx;bw=hrx*.7;y0=(a.m?a.m[1]+3:a.el[1]+5);y1=Math.floor(hy+hry)-2;inside=()=>true;sleeveOf=()=>false;}
  for(let y=y0;y<=y1;y++)for(let x=0;x<32;x++){const c=rows[y]&&rows[y][x];if(!ok(c)||!inside(x))continue;
    const sl=sleeveOf(x),dx=x+.5-cx;
    if(T==='trikot'&&sl)continue;
    if(T==='schuerze'&&Math.abs(dx)>Math.max(2.5,bw-1.5))continue;
    let col=(c==='B'||sl)?pal.A:pal.a;
    if(T==='ringel'&&(y-y0)%2===1)col=sl?pal.A:pal.c;
    if(T==='trikot'&&A.pin&&Math.round(Math.abs(dx))%3===2)col=pal.A;
    if(T==='schuerze')col=(x+y)%2?pal.a:pal.c;
    if(T==='kittel'&&Math.abs(dx)<.6)col=pal.A;
    if(A.band&&y>y1-3)col=A.band[y-(y1-2)];
    px(x,y,col);}
  const cxi=Math.round(cx-.5);px(cxi,y0,pal.c);px(cxi+1,y0,pal.c);
  const my=a.body?Math.round(a.body[1]-2):y0+1;
  if(T==='herz')[[-1,0],[1,0],[-2,1],[-1,1],[0,1],[1,1],[2,1],[-1,2],[0,2],[1,2],[0,3]].forEach(([dx,dy])=>px(cxi+dx,my+dy,pal.c));
  if(T==='hoodie'){for(let x=cxi-2;x<=cxi+3;x++)px(x,y1-1,pal.A);px(cxi-1,y0+1,pal.c);px(cxi+2,y0+1,pal.c);}
  if(T==='kittel'&&a.body){px(cxi-3,my,pal.c);px(cxi-3,my+1,pal.c);}
  if(T==='trikot'&&(a.body||st===2)){[...A.num].forEach((d,i)=>DIG[d].forEach((r,dy)=>{for(let dx=0;dx<3;dx++)if(r[dx]==='#')px(cxi-3+i*4+dx,my+dy-(a.body?0:1),pal.c);}));}
}
function petDraw(ctx,ox,oy,face,st){
  st=st===undefined?stageNow():st;
  if(st===0){paint(ctx,SP[face&&face.crack?'ei_riss':'ei'],{f:'#c9b0ef',F:'#a387d8'},ox,oy);return;}
  const key=petKey(st),rows=SP[key],a=ANC[key],P=PETPAL[G.pet.col]||PETPAL[0];
  paint(ctx,rows,{b:P.b,B:P.B,w:P.w,f:P.f,F:P.F},ox,oy);
  const px=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(ox+x,oy+y,1,1);};
  const top=getItem(G.wear.oberteil);if(top)drawTop(ctx,ox,oy,top,a,rows,st);
  const hals=getItem(G.wear.hals);if(hals)drawProc(ctx,ox,oy,CAT[hals.art].proc,itemPal(hals),a,rows);
  [a.el,a.er].forEach(([x,y],i)=>{
    if(face.eyes==='open'||face.eyes==='sad'){px(x,y,'#ffffff');px(x+1,y,DARK);px(x,y+1,DARK);px(x+1,y+1,DARK);
      if(face.eyes==='sad'&&i===0){px(x,y+2,'#8fd0f5');px(x,y+3,'#8fd0f5');}}
    else if(face.eyes==='happy'){px(x,y+1,DARK);px(x+1,y,DARK);px(x+2,y+1,DARK);}
    else{px(x,y+1,DARK);px(x+1,y+1,DARK);}
  });
  if(a.m){const [x,y]=a.m;
    if(face.mouth==='smile'){px(x-1,y,DARK);px(x,y+1,DARK);px(x+1,y+1,DARK);px(x+2,y,DARK);}
    else if(face.mouth==='frown'){px(x-1,y+1,DARK);px(x,y,DARK);px(x+1,y,DARK);px(x+2,y+1,DARK);}
    else if(face.mouth==='open'){px(x,y,DARK);px(x+1,y,DARK);px(x,y+1,'#f07a98');px(x+1,y+1,'#f07a98');}
    else{px(x,y+1,DARK);px(x+1,y+1,DARK);}}
  const g=getItem(G.wear.gesicht);if(g)drawProc(ctx,ox,oy,CAT[g.art].proc,itemPal(g),a,rows);
  const k=getItem(G.wear.kopf);
  if(k){const A=CAT[k.art];
    if(A.proc)drawProc(ctx,ox,oy,A.proc,itemPal(k),a,rows);
    else{const r=SP[A.spr+(st<=2?'_s':'_l')],w=r[0].length,h=r.length;
      let x=a.top[0]-Math.floor(w/2),y=a.top[1]-h+2;
      if(k.art==='schleife'){x=a.top[0]+2;y=a.top[1]-1;}
      if(k.art==='blumen')y=a.top[1]-1;
      paint(ctx,r,itemPal(k),ox+x,oy+y);}}
}

function showPop(){
  const o=$('#pop');
  if(POPS.length){const p=POPS.shift();(p.t==='hatch'?popHatch:popGrow)(o,p);return;}
  const c=G.gifts[0];if(!c){o.hidden=true;o.innerHTML='';render();return;}
  let h=`<div class="in"><div class="pp">${spr('geschenk_auf',{size:96,pal:{a:'#f6b3c8',A:'#e48aa8',c:'#fde6ee'}})}</div><div class="muted">${esc(c.sub||'')}</div><h3>${esc(c.title)}</h3>
    ${c.stars||Object.keys(c.treats||{}).length?`<div class="loot">${c.stars?`<span>${IC('stern',20)}+${c.stars} ★</span>`:''}${Object.keys(c.treats||{}).map(k=>`<span>${spr(k,{size:20})}+${c.treats[k]} ${TREATS[k].n}</span>`).join('')}</div>`:''}`;
  if(c.opts){h+=`<div style="font-family:var(--f-disp);font-size:19px;margin-top:2px">Such dir eins aus</div>`;
    c.opts.forEach((op,i)=>{
      if(op.t==='treat')h+=`<div class="pickc pp"><span class="tile">${spr(op.k,{size:30})}</span><div class="pt"><div class="pn">${op.n} × ${TREATS[op.k].n}</div><div class="muted">Leckerli</div></div><button class="btn small" data-i="${i}">Nehmen</button></div>`;
      else h+=`<div class="pickc pp${op.it.rar?' r'+op.it.rar:''}">${tile(op.it)}<div class="pt"><div class="pn">${esc(itemName(op.it))}</div><div class="muted">${KIND[slotOf(op.it)]}${op.it.rar?' · '+RARN[op.it.rar]:''}</div></div><button class="btn small" data-i="${i}">Nehmen</button></div>`;});}
  else if(c.single)h+=`<div class="pickc pp r3" style="justify-content:center">${tile(c.single,{size:44})}<div class="pt"><div class="pn">${esc(itemName(c.single))}</div><div class="muted">${KIND[slotOf(c.single)]} · Besonders</div></div></div><button class="btn pink" id="take" style="max-width:320px">Einsammeln</button>`;
  else h+=`<button class="btn" id="take" style="max-width:320px">Einsammeln</button>`;
  o.innerHTML=h+`</div>`;o.hidden=false;o.scrollTop=0;
  o.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const msg=claimGift(c,+b.dataset.i);toast(msg);showPop();});
  const t=o.querySelector('#take');if(t)t.onclick=()=>{const msg=claimGift(c,null);if(msg)toast(msg);showPop();};
}
function popHatch(o){
  const P=PETPAL[G.pet.col];
  o.innerHTML=`<div class="in"><div class="muted">Es wackelt …</div><h3>Es schlüpft!</h3><div id="eg" style="width:160px"><img class="px" src="${petURL({crack:true},0)}" width="32" height="36" style="width:160px;height:auto" alt=""></div><div id="rest"></div></div>`;
  o.hidden=false;o.scrollTop=0;
  setTimeout(()=>{
    o.querySelector('#eg').innerHTML=`<img class="px pp" src="${petURL({eyes:'happy',mouth:'open'},1)}" width="32" height="36" style="width:160px;height:auto" alt="">`;
    o.querySelector('h3').textContent='Ein '+SPN[G.pet.sp]+'!';o.querySelector('.muted').textContent='in '+P.n;
    const r=o.querySelector('#rest');
    r.innerHTML=`<p class="muted" style="margin:0 0 10px">Wie soll es heißen?</p><input id="nm" type="text" maxlength="16" placeholder="Name" autocomplete="off">
      <button class="btn pink" id="ok" style="max-width:320px;margin:12px auto 0">Hallo!</button>`;
    const go_=()=>{const v=r.querySelector('#nm').value.trim();G.pet.name=v||SPN[G.pet.sp];saveG();render();showPop();};
    r.querySelector('#ok').onclick=go_;r.querySelector('#nm').onkeydown=ev=>{if(ev.key==='Enter')go_();};
  },1300);
}
function popGrow(o,p){
  const nm=G.pet.name||SPN[G.pet.sp],f=p.stage===3?G.pet.f3:p.stage===4?G.pet.f4:null;
  o.innerHTML=`<div class="in"><div class="muted">Wachstum</div><h3>${esc(nm)} ist gewachsen!</h3>
    <img class="px pp" src="${petURL({eyes:'happy',mouth:'open'},p.stage)}" width="32" height="36" style="width:160px;height:auto" alt="">
    <div style="font-family:var(--f-disp);font-size:22px">Jetzt: ${STAGEN[p.stage]}</div>
    ${f?`<p style="margin:0">${esc(nm)} ist ${FORMN[f].n} geworden, ${FORMN[f].why}.</p>`:''}
    <button class="btn pink" id="ok" style="max-width:320px">Juhu!</button></div>`;
  o.hidden=false;o.scrollTop=0;o.querySelector('#ok').onclick=showPop;
}

/* ---------- Verlauf ---------- */
function vVerlauf(){
  const seg=el(`<div class="seg"></div>`);
  [['kalender','Kalender'],['zahlen','Zahlen']].forEach(q=>{const b=el(`<button aria-pressed="${VSUB===q[0]}"><b>${q[1]}</b></button>`);b.onclick=()=>{VSUB=q[0];render();};seg.appendChild(b);});
  view.appendChild(seg);
  (VSUB==='kalender'?vKalender:vZahlen)();
}
function dayCell(ds,month){
  const Ls=S.log.filter(l=>l.date===ds),b=S.bball.includes(ds),d=S.stretch.includes(ds),st=stepsOn(ds)>=10000;
  return `<button class="cell${Ls.length?' on':''}${ds===today()?' today':''}" data-d="${ds}"${ds>today()?' disabled':''} aria-label="${dayName(ds)} ${fmtDate(ds)}">${month?'<i>'+parse(ds).getDate()+'</i>':''}${Ls.length?'<b>'+Ls.map(l=>l.s).join('')+'</b>':''}<span class="ic">${b?IC('ball',10):''}${d?IC('blume',10):''}${st?IC('schuh',11):''}</span></button>`;
}
function vKalender(){
  const now=new Date();if(!CAL)CAL={y:now.getFullYear(),m:now.getMonth()};
  const first=new Date(CAL.y,CAL.m,1),off=(first.getDay()+6)%7,dim=new Date(CAL.y,CAL.m+1,0).getDate(),isCur=CAL.y===now.getFullYear()&&CAL.m===now.getMonth();
  const pre=CAL.y+'-'+String(CAL.m+1).padStart(2,'0')+'-';
  let g=DAYS.map(x=>`<div class="dn">${x}</div>`).join('');for(let k=0;k<off;k++)g+='<div class="cell out"></div>';
  for(let d=1;d<=dim;d++)g+=dayCell(pre+String(d).padStart(2,'0'),true);
  const ls=S.log.filter(l=>l.date.startsWith(pre)).length,bs=S.bball.filter(x=>x.startsWith(pre)).length,ss=S.stretch.filter(x=>x.startsWith(pre)).length;
  const c=el(`<section class="card"><div class="calhead"><button class="btn ghost small" id="pv" aria-label="Voriger Monat">‹</button><h2 class="num">${MONTHS[CAL.m]} ${CAL.y}</h2>
    <button class="btn ghost small" id="nx" aria-label="Nächster Monat"${isCur?' disabled':''}>›</button></div>
    <div class="week">${g}</div>
    <div class="stats" style="margin-top:12px"><div class="stat"><b class="num">${ls}</b><span>Trainings</span></div><div class="stat"><b class="num">${bs}</b><span>Basketball</span></div><div class="stat"><b class="num">${ss}</b><span>Dehn-Tage</span></div></div>
    <div class="hint">Grün sind Trainingstage mit dem Buchstaben der Einheit. Ball, Blume und Schuh stehen für Basketball, Dehnen und 10.000 Schritte. Tag antippen zum Nachtragen.</div></section>`);
  c.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>daySheet(b.dataset.d));
  c.querySelector('#pv').onclick=()=>{CAL.m--;if(CAL.m<0){CAL.m=11;CAL.y--;}render();};
  c.querySelector('#nx').onclick=()=>{if(isCur)return;CAL.m++;if(CAL.m>11){CAL.m=0;CAL.y++;}render();};
  view.appendChild(c);
}
function daySheet(ds){
  const Ls=S.log.filter(l=>l.date===ds),b=S.bball.includes(ds),d=S.stretch.includes(ds),st=stepsOn(ds);
  const s=el(`<div class="sheet"><div class="inner"><h3>${dayName(ds)} ${fmtDate(ds)}</h3><div id="ent"></div>
    <div class="eyebrow" style="margin-top:14px">Training eintragen</div><div class="seg" id="add"></div>
    <div class="btns"><button class="btn small ${b?'on':'ghost'}" id="bb">${IC('ball',14)} Basketball${b?' ✓':''}</button><button class="btn small ${d?'on':'ghost'}" id="dd">${IC('blume',14)} Gedehnt${d?' ✓':''}</button></div>
    <div class="row" style="margin-top:10px"><div class="field"><label for="sx">Schritte</label><input id="sx" type="text" inputmode="numeric" placeholder="${st?nf(st):'0'}"></div><button class="btn small" id="ss">Speichern</button></div>
    <div class="hint">Nachgetragen zählt alles. Geschenke gibt es für die letzten sieben Tage.</div>
    <button class="btn ghost" id="x">Schließen</button></div></div>`);
  const ent=s.querySelector('#ent');
  if(!Ls.length)ent.appendChild(el('<p class="muted" style="margin:6px 0 0">Kein Training eingetragen.</p>'));
  Ls.forEach(l=>{const r=el(`<div class="entry"><span>Einheit ${l.s}${l.warm?' · mit Aufwärmen':''}${l.note?'<br><span class="muted">'+esc(l.note)+'</span>':''}</span><button class="btn ghost small">Löschen</button></div>`);
    r.querySelector('button').onclick=()=>{S.log.splice(S.log.indexOf(l),1);commit('');daySheet(ds);};ent.appendChild(r);});
  PLAN.forEach(p=>{const bt=el(`<button aria-pressed="false"><b>${p.id}</b><span>${esc(p.short)}</span></button>`);
    bt.onclick=()=>{finishTraining(p.id,ds,false,'');host.innerHTML='';commit('Einheit '+p.id+' eingetragen');};s.querySelector('#add').appendChild(bt);});
  s.querySelector('#bb').onclick=()=>{toggleBall(ds);commit('');daySheet(ds);};
  s.querySelector('#dd').onclick=()=>{if(S.stretch.includes(ds))S.stretch=S.stretch.filter(x=>x!==ds);else S.stretch.push(ds);commit('');daySheet(ds);};
  s.querySelector('#ss').onclick=()=>{const v=num(String(s.querySelector('#sx').value).replace(/\./g,''));if(v===null)return;S.steps=S.steps.filter(x=>x.date!==ds);if(v>0)S.steps.push({date:ds,n:Math.round(v)});commit('');daySheet(ds);};
  s.onclick=ev=>{if(ev.target===s||ev.target.id==='x')host.innerHTML='';};
  host.innerHTML='';host.appendChild(s);
}
function vZahlen(){
  const x=G.pet.hatched?growth():wCalc(),stepsTot=S.steps.reduce((a,q)=>a+q.n,0);
  view.appendChild(el(`<section class="card"><h2>Insgesamt</h2><div class="stats">
    <div class="stat"><b class="num">${S.log.length}</b><span>Trainings</span></div><div class="stat"><b class="num">${S.bball.length}</b><span>Basketball</span></div>
    <div class="stat"><b class="num">${new Set(S.stretch).size}</b><span>Dehn-Tage</span></div><div class="stat"><b class="num">${nf(stepsTot)}</b><span>Schritte</span></div>
    <div class="stat"><b class="num">${S.steps.filter(q=>q.n>=10000).length}</b><span>Tage über 10.000</span></div><div class="stat"><b class="num">${x.streak}</b><span>Wochen in Folge</span></div></div></section>`));
  const t=el(`<section class="card"><h2>Übungen</h2><table><tbody></tbody></table><div class="hint">Stufe antippen in der Trainingsansicht. Jede neue Stufe zeigt, dass du stärker wirst.</div></section>`);
  PLAN.forEach(p=>p.ex.forEach(e=>{const o=curOpt(e),n=S.ev.filter(v=>v.t==='stage'&&v.ex===e.id).length;
    t.querySelector('tbody').appendChild(el(`<tr><td>${esc(o.n)}<br><span class="muted">${esc(curLvl(e))}${exState(e.id).note?' · '+esc(exState(e.id).note):''}</span></td><td class="r">${n?'+'+n+' Stufen':'Start'}</td></tr>`));}));
  view.appendChild(t);
  const rows=[['Training',x.sess],['Basketball',x.bb],['Dehnen',x.stretch],['Schritte',x.steps],['Neue Stufen',x.stage],['Aufwärmen',x.warm],['Wochenziele',x.bonus]];
  const wc=el(`<section class="card"><h2>Gesammelte Sterne</h2>${G.pet.hatched?'<p class="muted" style="margin:-4px 0 6px">Seit '+esc(G.pet.name||'dein Tier')+' geschlüpft ist</p>':''}<table><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="r">${nf(r[1])} ★</td></tr>`).join('')}<tr><td><b>Zusammen</b></td><td class="r"><b>${nf(x.total)} ★</b></td></tr></tbody></table></section>`);
  view.appendChild(wc);
}

/* ---------- Mehr ---------- */
function vMehr(){
  const standalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(HOSTED&&!standalone)view.appendChild(el(`<div class="banner"><b>Auf den Home-Bildschirm legen</b>In Safari unten auf Teilen tippen, dann „Zum Home-Bildschirm". Danach startet die App wie eine richtige App und läuft ohne Internet.</div>`));
  if(!HOSTED)view.appendChild(el(`<div class="banner"><b>Vorschau</b>Das ist die Vorschau. Die Version für den Home-Bildschirm liegt im Paket für GitHub Pages.</div>`));
  const g=el(`<section class="card"><h2>Wochenziel</h2>
    <div class="row"><div class="field"><label for="gs">Trainings</label><select id="gs"><option>1</option><option>2</option><option>3</option></select></div>
    <div class="field"><label for="gb">Basketball</label><select id="gb"><option>0</option><option>1</option><option>2</option><option>3</option></select></div></div>
    <div class="hint">Geschafft: +${STAR.week} ★ und ein Wochengeschenk.</div></section>`);
  g.querySelector('#gs').value=String(S.goal.s);g.querySelector('#gb').value=String(S.goal.b);
  g.querySelector('#gs').onchange=ev=>{S.goal.s=+ev.target.value;commit('Wochenziel geändert');};
  g.querySelector('#gb').onchange=ev=>{S.goal.b=+ev.target.value;commit('Wochenziel geändert');};
  view.appendChild(g);
  const p=el(`<section class="card"><h2>Winterschlaf</h2><p class="muted" style="margin:0">Für Urlaub, Krankheit oder Prüfungen. Dein Tier schläft und nichts wird schlechter.</p>
    <button class="btn ghost" id="pz">${paused()?'Winterschlaf beenden':'Winterschlaf beginnen'}</button></section>`);
  p.querySelector('#pz').onclick=()=>{const on=!paused();setPause(on);commit(on?'Gute Nacht':'Guten Morgen!');};
  view.appendChild(p);

  const copy=readCopy();
  const c=el(`<section class="card"><h2>Sichern und laden</h2>
    <p class="muted" style="margin:0 0 10px">Alles liegt nur auf diesem Handy. ${S.lastBackup?'Letzte Sicherung am '+fmtDate(S.lastBackup)+'.':'Noch keine Sicherung.'}</p>
    ${HOSTED?'<button class="btn" id="fs" style="margin-top:0">Sicherung speichern</button>':''}
    <div class="hint" id="msg"></div>
    <details class="warm"><summary>Mehr Möglichkeiten</summary>
      ${HOSTED?'<button class="btn ghost" id="fp">Nur das Trainingsprotokoll sichern</button>':''}
      <label for="fl" style="margin-top:12px">Sicherung aus Datei laden</label><input id="fl" type="file" accept=".json,application/json,text/plain">
      <label for="ta" style="margin-top:12px">Oder als Text</label><textarea id="ta" spellcheck="false"></textarea>
      <div class="btns"><button class="btn small" id="cp">Text kopieren</button><button class="btn small ghost" id="im">Eingefügten Text laden</button></div>
      ${copy?`<div class="eyebrow" style="margin-top:16px">Kopie vor dem letzten Update</div><p class="muted" style="margin:4px 0 0">Vom ${esc(copy.tag)}.</p><button class="btn ghost" id="rc">Diesen Stand zurückholen</button>`:''}
      <div class="eyebrow" style="margin-top:16px">Zurücksetzen</div>
      <button class="btn ghost" id="rg" style="margin-top:6px">Neues Ei, Training bleibt</button>
      <button class="btn ghost" id="rs">Alle Daten löschen</button><div id="confirm"></div></details></section>`);
  const ta=c.querySelector('#ta'),msg=c.querySelector('#msg');
  const full=()=>JSON.stringify({typ:'trainingsfreund',v:APP_V,s:S,g:G}),logOnly=()=>JSON.stringify({typ:'trainingsfreund-protokoll',v:APP_V,s:S});
  ta.value=full();
  const marked=()=>{S.lastBackup=today();save();};
  const loadText=t=>{try{const o=JSON.parse(t),un=q=>typeof q==='string'?JSON.parse(q):q;
      if(o&&o.s){S=migrate(un(o.s));if(o.g)G=migrateG(un(o.g));}else if(o&&Array.isArray(o.log))S=migrate(o);else throw new Error('Format');
      save();saveG();SPCACHE.clear();toast('Sicherung geladen');render();}catch(e){msg.textContent='Das ist keine gültige Sicherung.';}};
  const saveFile=async(text,name)=>{const file=new File([text],name,{type:'application/json'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});marked();msg.textContent='Gesichert.';return;}}catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();marked();msg.textContent='Datei gespeichert.';};
  const fs=c.querySelector('#fs'),fp=c.querySelector('#fp');
  if(fs)fs.onclick=()=>saveFile(full(),'trainingsfreund-'+today()+'.json');
  if(fp)fp.onclick=()=>saveFile(logOnly(),'trainingsprotokoll-'+today()+'.json');
  c.querySelector('#fl').onchange=ev=>{const f=ev.target.files&&ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>loadText(String(rd.result));rd.readAsText(f);};
  c.querySelector('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(ta.value);marked();msg.textContent='Kopiert. Leg den Text irgendwo ab, zum Beispiel in den Notizen.';}catch(e){ta.select();msg.textContent='Text ist markiert. Jetzt kopieren.';}};
  c.querySelector('#im').onclick=()=>loadText(ta.value);
  const ask=(title,text,label,fn)=>{const box=c.querySelector('#confirm');box.innerHTML='';
    const b=el(`<div class="banner" style="margin-top:10px"><b>${title}</b>${text}<div class="btns"><button class="btn small danger" id="yes">${label}</button><button class="btn small ghost" id="no">Abbrechen</button></div></div>`);
    b.querySelector('#yes').onclick=fn;b.querySelector('#no').onclick=()=>{box.innerHTML='';};box.appendChild(b);b.scrollIntoView({block:'nearest'});};
  const rc=c.querySelector('#rc');
  if(rc)rc.onclick=()=>ask('Stand zurückholen?','Der jetzige Stand wird durch die Kopie ersetzt.','Ja, zurückholen',()=>{
    try{S=migrate(JSON.parse(copy.raw.s));G=migrateG(copy.raw.g?JSON.parse(copy.raw.g):null);save();saveG();SPCACHE.clear();toast('Kopie geladen');render();}catch(e){msg.textContent='Die Kopie ließ sich nicht lesen.';}});
  c.querySelector('#rg').onclick=()=>ask('Wirklich ein neues Ei?','Tier, Sachen und Sterne beginnen neu. Das Trainingsprotokoll bleibt.','Ja, neues Ei',()=>{
    G=migrateG(null);saveG();startGame();SPCACHE.clear();toast('Ein neues Ei liegt im Körbchen');go('home');});
  c.querySelector('#rs').onclick=()=>ask('Wirklich alles löschen?','Trainings, Basketball, Dehnen, Schritte, Tier und Sachen werden gelöscht.','Ja, alles löschen',()=>{
    S=migrate({});G=migrateG(null);save();saveG();SPCACHE.clear();toast('Alles gelöscht');go('home');});
  view.appendChild(c);

  view.appendChild(el(`<section class="card"><h2>So funktioniert's</h2><table><tbody>
    <tr><td>Training</td><td class="r">+${STAR.sess} ★ und Geschenk</td></tr>
    <tr><td>Basketball</td><td class="r">+${STAR.bball} ★ und Geschenk</td></tr>
    <tr><td>Gedehnt</td><td class="r">+${STAR.stretch} ★</td></tr>
    <tr><td>10.000 Schritte</td><td class="r">+${STAR.steps} ★</td></tr>
    <tr><td>Aufwärmen</td><td class="r">+${STAR.warm} ★</td></tr>
    <tr><td>Neue Stufe einer Übung</td><td class="r">+${STAR.stage} ★</td></tr>
    <tr><td>Wochenziel</td><td class="r">+${STAR.week} ★ und Geschenk</td></tr></tbody></table>
    <p class="muted" style="margin:10px 0 0">Sterne sind die einzige Währung. Was du sammelst, lässt dein Tier wachsen: ab ${nf(STAGEW[2])} ★ ist es ein Kind, ab ${nf(STAGEW[3])} jugendlich, ab ${nf(STAGEW[4])} erwachsen. Ausgeben im Laden macht es nicht kleiner. Training und Basketball zählen je höchstens dreimal pro Woche.</p>
    <p class="muted" style="margin:8px 0 0">Training macht satt, Basketball fröhlich, Dehnen und Schritte halten gepflegt. Fehlt etwas, zeigt es dir das. Krank wird es nie, nachts schläft es.</p></section>`));
}
/* ================= Start ================= */
startGame();gameTick();save();saveG();GSEEN=G.stats.gifts;
render();
if(POPS.length)showPop();
let RDAY=today(),RTOD=tod();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;drawTimer();
  if(today()!==RDAY||tod()!==RTOD){RDAY=today();RTOD=tod();gameTick();save();saveG();render();if(POPS.length)showPop();}});
setInterval(()=>{if(tod()!==RTOD){RTOD=tod();if(TAB==='home'&&!host.firstChild)render();}},60000);
if(HOSTED&&'serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
